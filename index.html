<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f1eb"><meta name="description" content="PICSS — a living collection of photographs.">
  <title>PICSS — A visual collection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css"><script src="app.js" defer></script>
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div><div class="ambient ambient-two" aria-hidden="true"></div>
  <header class="topbar"><span>picss<span class="brand-period">.</span></header>
  <main class="page-shell">

    <section class="collection" aria-label="Photography collection"><div class="collection-heading"><div><p class="section-kicker">My shots</p><h2>check em outt honey</h2></div><p id="photo-count" class="photo-count" aria-live="polite">finding furina...</p></div>
      <div class="toolbar"><label class="search-box"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 4.2 4.2"></path></svg><input id="search-input" type="search" placeholder="search noods" autocomplete="off"></label><div class="toolbar-right"><span class="sort-label">SORT</span><label class="select-wrap"><span class="sr-only">Sort photographs</span><select id="sort-select"><option value="newest">Newest first</option><option value="oldest">Oldest first</option></select></label></div></div>
      <div id="gallery" class="gallery" aria-label="Photo gallery"><div class="loading-state"><span class="loader"></span><span>collecting furina noods /j</span></div></div>
      <div id="empty-state" class="empty-state" hidden><span class="empty-symbol">⌕</span><h3>oopsies there is none sweety</h3><p>try search on rule34 /j</p><button id="clear-search" class="text-button" type="button">Clear</button></div>
      <section id="error-state" class="error-state" hidden><span class="error-icon">!</span><h2>The archive couldn't load.</h2><p id="error-message">Check your connection and try again.</p><button id="retry-button" class="primary-button" type="button">Try again</button></section>
    </section>
  </main>
  <dialog id="photo-viewer" class="viewer" aria-label="Photograph viewer"><div class="viewer-top"><span class="viewer-brand">picss<span>.</span></span><button id="viewer-close" class="icon-button" type="button" aria-label="Close viewer"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"></path></svg></button></div><button id="viewer-prev" class="viewer-arrow viewer-prev" type="button" aria-label="Previous photograph"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"></path></svg></button><div class="viewer-content"><div class="viewer-image-wrap"><img id="viewer-image" src="" alt=""></div><div class="viewer-details"><div><p class="viewer-kicker">FROM THE COLLECTION</p><h2 id="viewer-title"></h2><p id="viewer-date"></p></div><span id="viewer-position" class="viewer-position"></span></div></div><button id="viewer-next" class="viewer-arrow viewer-next" type="button" aria-label="Next photograph"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"></path></svg></button></dialog>
</body></html>
