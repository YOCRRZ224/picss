<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f7f5">
    <meta name="description" content="A collection of photographs.">
    <title>picss — Photography</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <header class="site-header">
        <a class="brand" href="./">picss<span>.</span></a>
        <span class="header-caption">A PHOTOGRAPHY ARCHIVE</span>
    </header>

    <main>
        <section class="intro">
            <div>
                <p class="eyebrow">THE COLLECTION</p>
                <h1>Photographs<span>.</span></h1>
                <p class="intro-copy">A collection of moments, places and things.</p>
            </div>
            <p id="photo-count" class="photo-count">Loading collection...</p>
        </section>

        <section id="gallery" class="gallery" aria-label="Photo gallery">
            <p class="status-message">Loading photographs...</p>
        </section>

        <section id="error-state" class="status-panel" hidden>
            <h2>Couldn't load the collection.</h2>
            <p id="error-message">Please check your connection and try again.</p>
            <button id="retry-button" type="button">Try again</button>
        </section>
    </main>

    <footer class="site-footer">
        <span>picss archive</span>
        <span>Made to preserve moments.</span>
    </footer>

    <dialog id="photo-viewer" class="viewer">
        <button id="viewer-close" class="viewer-close" type="button"
                aria-label="Close image viewer">×</button>
        <div class="viewer-content">
            <img id="viewer-image" src="" alt="">
            <div class="viewer-details">
                <h2 id="viewer-title"></h2>
                <p id="viewer-date"></p>
            </div>
        </div>
    </dialog>
</body>
</html>
